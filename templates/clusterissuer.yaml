{{- range .Values.clusterIssuers }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .name }}
spec:
  acme:
    email: {{ default $.Values.email .email }}
    privateKeySecretRef:
      name: {{ .name }}-account
    server: {{ .url }}
    solvers:
      {{- include "acme-issuers.solvers" (dict "issuer" . "root" $) | nindent 6 }}
{{- end }}
