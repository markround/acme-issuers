name: Publish Helm Chart

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'

env:
  CHART_PATH: .
  CHART_NAME: acme-issuers
  # `helm push` takes the repository PREFIX only - it appends "/<chart-name>:<chart-version>"
  # itself, using the metadata baked into the packaged .tgz.
  OCI_REPO_PREFIX: "ghcr.io/${{ github.repository_owner }}/acme-issuers"

jobs:
  publish-oci-helm-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get chart version
        id: get_chart_version
        run: |
          CHART_VERSION=$(grep -m1 '^version:' ${{ env.CHART_PATH }}/Chart.yaml | awk '{print $2}')
          echo "chart_version=$CHART_VERSION" >> $GITHUB_OUTPUT
          echo "CHART_VERSION=$CHART_VERSION" >> $GITHUB_ENV

      - name: Extract version and OCI tag
        id: extract_version
        run: |
          # On tag pushes: version/OCI tag comes from the tag (e.g. v0.3.1 -> 0.3.1)
          # On branch pushes: <chart_version>-<branch> as a semver prerelease.
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RAW=${GITHUB_REF#refs/tags/}
            VERSION=${RAW#v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=$VERSION" >> $GITHUB_OUTPUT
            echo "is_tag=true" >> $GITHUB_OUTPUT
            echo "tag_name=$RAW" >> $GITHUB_OUTPUT
          else
            BRANCH=${GITHUB_REF#refs/heads/}
            # The OCI tag is set via `helm package --version`, which requires valid
            # semver: a prerelease component may only contain [0-9A-Za-z-], so
            # underscores/slashes/dots from the branch name must be folded to "-".
            SAFE_BRANCH=$(printf '%s' "$BRANCH" | tr -c 'a-zA-Z0-9' '-' | sed -e 's/--*/-/g' -e 's/^-//' -e 's/-$//')
            echo "tag=${CHART_VERSION}-${SAFE_BRANCH}" >> $GITHUB_OUTPUT
            echo "is_tag=false" >> $GITHUB_OUTPUT
            echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          fi

      - name: Verify version consistency (tag releases only)
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [ "${{ steps.extract_version.outputs.version }}" != "${{ steps.get_chart_version.outputs.chart_version }}" ]; then
              echo "Error: Tag version (${{ steps.extract_version.outputs.version }}) does not match chart version (${{ steps.get_chart_version.outputs.chart_version }})"
              exit 1
            fi
            echo "✅ Version consistency verified: ${{ steps.extract_version.outputs.version }}"
          else
            echo "ℹ️ Skipping version consistency check for branch push"
          fi

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: '3.13.0'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push OCI Helm chart
        run: |
          mkdir -p ./oci-charts

          TAG="${{ steps.extract_version.outputs.tag }}"

          # The pushed OCI tag is the packaged chart version - `helm push` derives the
          # reference from the .tgz metadata and will not accept a tag in its argument.
          helm package ${{ env.CHART_PATH }} --destination ./oci-charts --version "$TAG"

          CHART_FILE="${CHART_NAME}-${TAG}.tgz"

          echo "Pushing OCI chart to $OCI_REPO_PREFIX/$CHART_NAME:$TAG"
          helm push "./oci-charts/$CHART_FILE" "oci://$OCI_REPO_PREFIX"
          echo "OCI Helm chart pushed successfully (tag: $TAG)"

      - name: Output publication details
        run: |
          echo "## 📦 OCI Helm Chart Published Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Chart:** $CHART_NAME" >> $GITHUB_STEP_SUMMARY
          echo "**OCI Tag:** ${{ steps.extract_version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Chart.yaml Version:** ${{ steps.get_chart_version.outputs.chart_version }}" >> $GITHUB_STEP_SUMMARY
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "**Source:** ${{ steps.extract_version.outputs.tag_name }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Branch:** ${{ steps.extract_version.outputs.branch }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation Commands:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "helm install $CHART_NAME oci://$OCI_REPO_PREFIX/$CHART_NAME --version ${{ steps.extract_version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
